            const tx = db.transaction(SETTINGS_STORE, 'readonly');
            return idbRequest(tx.objectStore(SETTINGS_STORE).get(id));
        }

        async function putSetting(value) {
            const tx = db.transaction(SETTINGS_STORE, 'readwrite');
            await idbRequest(tx.objectStore(SETTINGS_STORE).put(value));
        }

        async function getConversationRecord(id) {
            const tx = db.transaction(CONVERSATIONS_STORE, 'readonly');
            return idbRequest(tx.objectStore(CONVERSATIONS_STORE).get(id));
        }

        async function getAllConversationRecords() {
            const tx = db.transaction(CONVERSATIONS_STORE, 'readonly');
            return idbRequest(tx.objectStore(CONVERSATIONS_STORE).getAll());
        }

        async function putConversationRecord(record) {
            const tx = db.transaction(CONVERSATIONS_STORE, 'readwrite');
            await idbRequest(tx.objectStore(CONVERSATIONS_STORE).put(record));
        }

        async function deleteConversationRecord(id) {
            const tx = db.transaction(CONVERSATIONS_STORE, 'readwrite');
            await idbRequest(tx.objectStore(CONVERSATIONS_STORE).delete(id));
        }

        async function clearDatabaseData() {
            const tx = db.transaction([SETTINGS_STORE, CONVERSATIONS_STORE], 'readwrite');
            tx.objectStore(SETTINGS_STORE).clear();
            tx.objectStore(CONVERSATIONS_STORE).clear();
            await new Promise((resolve, reject) => {
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error);
            });
        }

        // ---------- Crypto ----------
        function randomBytes(length) {
            const bytes = new Uint8Array(length);
            crypto.getRandomValues(bytes);
            return bytes;
        }

        async function deriveKey(password, salt) {
            const material = await crypto.subtle.importKey(
                'raw',
                new TextEncoder().encode(password),
                'PBKDF2',
                false,
                ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt,
                    iterations: PBKDF2_ITERATIONS,
                    hash: 'SHA-256'
                },
                material,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptObject(key, object) {
            const iv = randomBytes(12);
            const plaintext = new TextEncoder().encode(JSON.stringify(object));
            const ciphertext = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv },
                key,
                plaintext
            );
            return {
                iv: Array.from(iv),
                ciphertext: Array.from(new Uint8Array(ciphertext))
            };
        }

        async function decryptObject(key, encrypted) {
            const plaintext = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: new Uint8Array(encrypted.iv) },
                key,
                new Uint8Array(encrypted.ciphertext)
            );
            return JSON.parse(new TextDecoder().decode(plaintext));
        }

        async function makeSecurityRecord(password) {
            const salt = randomBytes(16);
            const key = await deriveKey(password, salt);
            const verifier = await encryptObject(key, { check: 'dawns-door-unlocked' });
            return {
                record: {
                    id: 'security',
                    salt: Array.from(salt),
                    verifier
                },
                key
            };
        }

        async function keyFromPassword(password, securityRecord) {
            const key = await deriveKey(password, new Uint8Array(securityRecord.salt));
            const verifier = await decryptObject(key, securityRecord.verifier);
            if (!verifier || verifier.check !== 'dawns-door-unlocked') {
                throw new Error('Incorrect password.');
            }
            return key;
        }

        // ---------- View helpers ----------
        function showOnly(view) {
            authView.classList.toggle('hidden', view !== 'auth');
            listView.classList.toggle('hidden', view !== 'list');
            chatView.classList.toggle('hidden', view !== 'chat');
            headerActions.classList.toggle('hidden', view === 'auth');
        }

        function setAuthHtml(html) {
            authContent.innerHTML = html;
        }

        function formatDate(timestamp) {
            return new Intl.DateTimeFormat(undefined, {
                dateStyle: 'medium',
                timeStyle: 'short'
            }).format(new Date(timestamp));
        }

        function makeDefaultTitle(timestamp) {
            return formatDate(timestamp);
        }

        async function requestPersistentStorage() {
            try {
                if (navigator.storage && navigator.storage.persist) {
                    await navigator.storage.persist();
                }
            } catch (_) {
                // Persistence is a best-effort browser feature. Nothing breaks if denied.
            }
        }

        // ---------- Password/setup screens ----------
        function renderSetupScreen(message = '') {
            showOnly('auth');
            setAuthHtml(`
                <h2>Create your Dawn's Door password</h2>
                <div class="guidance">
                    Use a new password just for Dawn's Door. Don't reuse any password you already use.
                    Your password is not stored and cannot be recovered if you forget it, but you can
                    clear all history and create a new one if you need to.
                </div>
                <div class="field">
                    <label for="setup-password">Password</label>
                    <input id="setup-password" type="password" autocomplete="new-password">
                    <div class="helper">Longer passwords are harder for someone else to guess.</div>
                </div>
                <div class="field">
                    <label for="setup-password-confirm">Confirm password</label>
                    <input id="setup-password-confirm" type="password" autocomplete="new-password">
                </div>
                <div class="button-row">
                    <button id="setup-submit" class="primary" type="button">Create Password</button>
                </div>
                <div id="setup-error" class="error-text">${escapeHtml(message)}</div>
            `);

            const password = document.getElementById('setup-password');
            const confirmPassword = document.getElementById('setup-password-confirm');
            const submit = document.getElementById('setup-submit');
            const error = document.getElementById('setup-error');

            const create = async () => {
                error.textContent = '';
                if (!password.value) {
                    error.textContent = 'Please enter a password.';
                    return;
                }
                if (password.value !== confirmPassword.value) {
                    error.textContent = 'Those passwords do not match.';
                    return;
                }
                submit.disabled = true;
                try {
                    const { record, key } = await makeSecurityRecord(password.value);
                    await putSetting(record);
                    cryptoKey = key;
                    password.value = '';
                    confirmPassword.value = '';
                    await requestPersistentStorage();
                    await createNewConversation();
                } catch (err) {
                    error.textContent = `I couldn't set up local storage: ${err.message}`;
                    submit.disabled = false;
                }
            };

            submit.addEventListener('click', create);
            confirmPassword.addEventListener('keydown', e => {
                if (e.key === 'Enter') create();
            });
            password.focus();
        }

        function renderUnlockScreen(message = '') {
            showOnly('auth');
            setAuthHtml(`
                <h2>Dawn's Door is locked</h2>
                <p>Enter your Dawn's Door password to open your saved conversations.</p>
                <div class="field">
                    <label for="unlock-password">Password</label>
                    <input id="unlock-password" type="password" autocomplete="current-password">
                </div>
                <div class="button-row">
                    <button id="unlock-submit" class="primary" type="button">Unlock</button>
                    <button id="locked-reset" class="secondary danger" type="button">Clear all history &amp; create a new password</button>
                </div>
                <div id="unlock-error" class="error-text">${escapeHtml(message)}</div>
            `);

            const password = document.getElementById('unlock-password');
            const submit = document.getElementById('unlock-submit');
            const error = document.getElementById('unlock-error');

            const unlock = async () => {
                error.textContent = '';
                submit.disabled = true;
                try {
                    const security = await getSetting('security');
                    cryptoKey = await keyFromPassword(password.value, security);
                    password.value = '';
                    await requestPersistentStorage();
                    await renderConversationList();
                } catch (_) {
                    cryptoKey = null;
                    error.textContent = 'That password did not unlock the Door.';
                    submit.disabled = false;
                    password.select();
                }
            };

            submit.addEventListener('click', unlock);
            password.addEventListener('keydown', e => {
                if (e.key === 'Enter') unlock();
            });
            document.getElementById('locked-reset').addEventListener('click', resetEverything);
            password.focus();
        }

        async function renderChangePasswordScreen() {
            if (!cryptoKey) return;
            showOnly('auth');
            headerActions.classList.remove('hidden');
            setAuthHtml(`
                <h2>Change Dawn's Door password</h2>
                <p>This re-encrypts every saved conversation with the new password.</p>
                <div class="field">
                    <label for="new-password">New password</label>
                    <input id="new-password" type="password" autocomplete="new-password">
                    <div class="helper">Longer passwords are harder for someone else to guess.</div>
                </div>
                <div class="field">
                    <label for="new-password-confirm">Confirm new password</label>
                    <input id="new-password-confirm" type="password" autocomplete="new-password">
                </div>
                <div class="button-row">
                    <button id="change-password-submit" class="primary" type="button">Change Password</button>
                    <button id="change-password-cancel" class="secondary" type="button">Cancel</button>
                </div>
                <div id="change-password-error" class="error-text"></div>
            `);

            const password = document.getElementById('new-password');
            const confirmPassword = document.getElementById('new-password-confirm');
            const submit = document.getElementById('change-password-submit');
            const error = document.getElementById('change-password-error');

            document.getElementById('change-password-cancel').addEventListener('click', renderConversationList);

            submit.addEventListener('click', async () => {
                error.textContent = '';
                if (!password.value) {
                    error.textContent = 'Please enter a password.';
                    return;
                }
                if (password.value !== confirmPassword.value) {
                    error.textContent = 'Those passwords do not match.';
                    return;
                }

                submit.disabled = true;
                try {
                    const records = await getAllConversationRecords();
                    const decrypted = [];
                    for (const record of records) {
                        decrypted.push({
                            record,
                            payload: await decryptObject(cryptoKey, record.encrypted)
                        });
                    }

                    const { record: securityRecord, key: newKey } = await makeSecurityRecord(password.value);

                    const rewritten = [];
                    for (const item of decrypted) {
                        rewritten.push({
                            ...item.record,
                            encrypted: await encryptObject(newKey, item.payload)
                        });
                    }

                    const tx = db.transaction([SETTINGS_STORE, CONVERSATIONS_STORE], 'readwrite');
                    tx.objectStore(SETTINGS_STORE).put(securityRecord);
                    const convStore = tx.objectStore(CONVERSATIONS_STORE);
                    for (const record of rewritten) convStore.put(record);

                    await new Promise((resolve, reject) => {
                        tx.oncomplete = resolve;
                        tx.onerror = () => reject(tx.error);
                        tx.onabort = () => reject(tx.error);
                    });

                    cryptoKey = newKey;
                    password.value = '';
                    confirmPassword.value = '';
                    await renderConversationList();
                } catch (err) {
                    error.textContent = `The password was not changed: ${err.message}`;
                    submit.disabled = false;
                }
            });

            password.focus();
        }

        // ---------- Conversations ----------
        function newConversationId() {
            if (crypto.randomUUID) return crypto.randomUUID();
            return `${Date.now()}-${Array.from(randomBytes(8)).map(b => b.toString(16).padStart(2, '0')).join('')}`;
        }

        async function createNewConversation() {
            if (!cryptoKey) return;
            const now = Date.now();
            activeConversation = {
                id: newConversationId(),
                createdAt: now,
                updatedAt: now,
                title: makeDefaultTitle(now),
                messages: []
            };
            conversationHistory = [];
            await saveActiveConversation();
            openActiveConversation();
        }

        async function saveActiveConversation() {
            if (!cryptoKey || !activeConversation) return;
            activeConversation.updatedAt = Date.now();
            activeConversation.messages = conversationHistory;
            const encrypted = await encryptObject(cryptoKey, {
                title: activeConversation.title,
                messages: activeConversation.messages
            });
            await putConversationRecord({
                id: activeConversation.id,
                createdAt: activeConversation.createdAt,
                updatedAt: activeConversation.updatedAt,
                encrypted
            });
        }

        async function loadConversation(id) {
            if (!cryptoKey) return;
            const record = await getConversationRecord(id);
            if (!record) return;
            const payload = await decryptObject(cryptoKey, record.encrypted);
            activeConversation = {
                id: record.id,
                createdAt: record.createdAt,
                updatedAt: record.updatedAt,
                title: payload.title || makeDefaultTitle(record.createdAt),
                messages: Array.isArray(payload.messages) ? payload.messages : []
            };
            conversationHistory = activeConversation.messages.slice();
            openActiveConversation();
        }

        function openActiveConversation() {
            showOnly('chat');
            renderChatHistory();
            messageInput.disabled = false;
            sendButton.disabled = false;
            messageInput.focus();
        }

        function renderChatHistory() {
            chatContainer.replaceChildren();
            if (!conversationHistory.length) {
                addMessage('Dawn', "Hey, beautiful lady. How's it going?");
                return;
            }
            for (const message of conversationHistory) {
                addMessage(message.role === 'user' ? 'You' : 'Dawn', message.content);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function renderConversationList() {
            if (!cryptoKey) return;
            showOnly('list');
            conversationList.replaceChildren();

            try {
                const records = await getAllConversationRecords();
                records.sort((a, b) => b.updatedAt - a.updatedAt);

                if (!records.length) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-state';
                    empty.textContent = 'No saved conversations yet.';
                    conversationList.appendChild(empty);
                    return;
                }

                for (const record of records) {
                    const payload = await decryptObject(cryptoKey, record.encrypted);
                    const card = document.createElement('div');
                    card.className = 'conversation-card';

                    const title = document.createElement('div');
                    title.className = 'conversation-title';
                    title.textContent = payload.title || makeDefaultTitle(record.createdAt);

                    const date = document.createElement('div');
                    date.className = 'conversation-date';
                    date.textContent = `Started ${formatDate(record.createdAt)}`;

                    const actions = document.createElement('div');
                    actions.className = 'conversation-actions';

                    const open = makeButton('Open', () => loadConversation(record.id));
                    const rename = makeButton('Rename', async () => {
                        const currentTitle = payload.title || makeDefaultTitle(record.createdAt);
                        const renamed = window.prompt('Conversation name:', currentTitle);
                        if (renamed === null) return;
                        const trimmed = renamed.trim();
                        payload.title = trimmed || makeDefaultTitle(record.createdAt);
                        record.updatedAt = Date.now();
                        record.encrypted = await encryptObject(cryptoKey, payload);
                        await putConversationRecord(record);
                        await renderConversationList();
                    });
                    const del = makeButton('Delete', async () => {
                        if (!window.confirm('Delete this conversation permanently? This cannot be undone.')) return;
                        await deleteConversationRecord(record.id);
                        if (activeConversation && activeConversation.id === record.id) {
                            activeConversation = null;
                            conversationHistory = [];
                        }
                        await renderConversationList();
                    });
                    del.classList.add('danger');

                    actions.append(open, rename, del);
                    card.append(title, date, actions);
                    conversationList.appendChild(card);
                }
            } catch (err) {
                conversationList.textContent = `I couldn't open the saved conversation list: ${err.message}`;
            }
        }

        function makeButton(text, handler) {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = text;
            button.addEventListener('click', handler);
            return button;
        }

        // ---------- Chat rendering ----------
        function addMessage(sender, content, isThinking = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';

            if (sender === 'You') {
                messageDiv.classList.add('user-message');
                messageDiv.textContent = content;
            } else {
                messageDiv.classList.add('dawn-message');
                if (isThinking) messageDiv.classList.add('thinking');

                if (!isThinking) {
                    const label = document.createElement('div');
                    label.className = 'dawn-label';
                    label.textContent = 'Dawn';
                    messageDiv.appendChild(label);
                }

                const contentDiv = document.createElement('div');
                contentDiv.textContent = content;
                messageDiv.appendChild(contentDiv);
            }

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        function addFailureMessage(details, retryHandler) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message dawn-message error-message';

            const label = document.createElement('div');
            label.className = 'dawn-label';
            label.textContent = 'Dawn';

            const text = document.createElement('div');
            text.textContent = "I'm sorry, sweetheart, I'm having trouble connecting right now. Message the real Dawn and let her know, please.";

            const controls = document.createElement('div');
            controls.className = 'error-controls';

            const retry = document.createElement('button');
            retry.type = 'button';
            retry.className = 'retry-button';
            retry.textContent = 'Retry';
            retry.addEventListener('click', async () => {
                retry.disabled = true;
                await retryHandler(messageDiv);
            });

            const detailBox = document.createElement('details');
            const summary = document.createElement('summary');
            summary.textContent = 'Show error details';
            const pre = document.createElement('div');
            pre.className = 'error-details';
            pre.textContent = details;
            detailBox.append(summary, pre);

            controls.append(retry, detailBox);
            messageDiv.append(label, text, controls);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        // ---------- DeepSeek request ----------
        async function requestAssistant() {
            const messages = [
                { role: 'system', content: DAWN_SYSTEM_PROMPT },
                ...conversationHistory.slice(-MODEL_CONTEXT_MESSAGES)
            ];

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages,
                        temperature: 0.8,
                        max_tokens: 1000
                    }),
                    signal: controller.signal
                });

                const raw = await response.text();

                if (!response.ok) {
                    const detail = raw
                        ? `HTTP ${response.status}\n${raw}`
                        : `HTTP ${response.status}${response.statusText ? ` ${response.statusText}` : ''}`;
                    throw new Error(detail);
                }

                let data;
                try {
                    data = JSON.parse(raw);
                } catch (_) {
                    throw new Error(`The server returned something that was not valid JSON.\n${raw.slice(0, 1000)}`);
                }

                const assistantMessage = data?.choices?.[0]?.message?.content;
                if (typeof assistantMessage !== 'string') {
                    throw new Error(`The server response did not contain a usable message.\n${raw.slice(0, 1000)}`);
                }

                return assistantMessage;
            } catch (err) {
                if (err.name === 'AbortError') {
                    throw new Error('The request timed out after 60 seconds.');
                }
                throw err;
            } finally {
                clearTimeout(timer);
            }
        }

        async function getAssistantResponse(existingErrorDiv = null) {
            if (requestInFlight || !activeConversation || !cryptoKey) return;
            requestInFlight = true;
            messageInput.disabled = true;
            sendButton.disabled = true;

            if (existingErrorDiv?.isConnected) existingErrorDiv.remove();
            const thinkingDiv = addMessage('Dawn', 'Thinking...', true);

            try {
                const response = await requestAssistant();
                if (thinkingDiv.isConnected) thinkingDiv.remove();

                conversationHistory.push({ role: 'assistant', content: response });
                await saveActiveConversation();
                addMessage('Dawn', response);
            } catch (error) {
                if (thinkingDiv.isConnected) thinkingDiv.remove();
                addFailureMessage(error.message, async errorDiv => {
                    await getAssistantResponse(errorDiv);
                });
            } finally {
                requestInFlight = false;
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || requestInFlight || !activeConversation || !cryptoKey) return;

            conversationHistory.push({ role: 'user', content: message });
            addMessage('You', message);
            messageInput.value = '';

            // Save the user's words immediately, even if the API call fails.
            try {
                await saveActiveConversation();
            } catch (error) {
                addFailureMessage(
                    `The message could not be saved locally.\n${error.message}`,
                    async errorDiv => {
                        try {
                            await saveActiveConversation();
                            if (errorDiv.isConnected) errorDiv.remove();
                            await getAssistantResponse();
                        } catch (retryError) {
                            const details = errorDiv.querySelector('.error-details');
                            if (details) details.textContent = `The message still could not be saved locally.\n${retryError.message}`;
                        }
                    }
                );
                return;
            }

            await getAssistantResponse();
        }

        // ---------- Privacy actions ----------
        function lockDoor() {
            cryptoKey = null;
            activeConversation = null;
            conversationHistory = [];
            requestInFlight = false;
            messageInput.value = '';
            chatContainer.replaceChildren();
            conversationList.replaceChildren();
            renderUnlockScreen();
        }

        async function resetEverything() {
            const first = window.confirm(
                'Clear ALL Dawn\'s Door history from this browser? Every saved conversation will be permanently deleted.'
            );
            if (!first) return;

            const second = window.confirm(
                'This cannot be undone. Clear everything and create a new password?'
            );
            if (!second) return;

            try {
                await clearDatabaseData();
                cryptoKey = null;
                activeConversation = null;
                conversationHistory = [];
                chatContainer.replaceChildren();
                conversationList.replaceChildren();
                renderSetupScreen();
            } catch (err) {
                window.alert(`I couldn't clear the saved data: ${err.message}`);
            }
        }

        // ---------- Small helpers ----------
        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        // ---------- Events ----------
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !messageInput.disabled) sendMessage();
        });

        document.getElementById('lock-button').addEventListener('click', lockDoor);
        document.getElementById('conversations-button').addEventListener('click', renderConversationList);
        document.getElementById('new-conversation-button').addEventListener('click', createNewConversation);
        document.getElementById('change-password-button').addEventListener('click', renderChangePasswordScreen);
        document.getElementById('clear-all-button').addEventListener('click', resetEverything);

        // ---------- Initialize ----------
        window.addEventListener('load', async () => {
            try {
                db = await openDatabase();

                if (!window.crypto?.subtle) {
                    renderSetupScreen('This browser does not support the encryption tools Dawn\'s Door needs.');
                    return;
                }

                const security = await getSetting('security');
                if (security) {
                    renderUnlockScreen();
                } else {
                    renderSetupScreen();
                }
            } catch (err) {
                showOnly('auth');
                setAuthHtml(`
                    <h2>Dawn's Door couldn't open local storage</h2>
                    <p class="error-text">${escapeHtml(err.message)}</p>
                `);
            }
        });
    </script>
</body>
