<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dawn's Door V2</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --blue: #007bff;
            --blue-dark: #0056b3;
            --purple: #764ba2;
            --text: #242424;
            --muted: #6c757d;
            --border: #e0e0e0;
            --panel: #ffffff;
            --soft: #f8f9fa;
            --danger: #b42318;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 10px;
            color: var(--text);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            min-height: 100dvh;
        }
        button, input {
            font: inherit;
        }
        button {
            cursor: pointer;
        }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }
        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 20px);
            height: calc(100dvh - 20px);
        }
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 12px 15px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .header h1 {
            margin: 0;
            font-size: 1.5em;
            font-weight: 300;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .header button {
            border: 1px solid rgba(255,255,255,0.75);
            color: white;
            background: rgba(255,255,255,0.14);
            border-radius: 999px;
            padding: 7px 11px;
        }
        .view {
            flex: 1;
            min-height: 0;
        }
        .hidden {
            display: none !important;
        }

        /* Authentication / privacy screens */
        #auth-view {
            overflow-y: auto;
            padding: 24px 16px;
            background: var(--soft);
        }
        .auth-card {
            width: min(520px, 100%);
            margin: 0 auto;
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }
        .auth-card h2 {
            margin: 0 0 12px;
            font-size: 1.35em;
        }
        .auth-card p {
            line-height: 1.5;
        }
        .guidance {
            background: #eef6ff;
            border-left: 4px solid var(--blue);
            padding: 12px;
            border-radius: 8px;
            margin: 14px 0;
        }
        .field {
            margin: 14px 0;
        }
        .field label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .field input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }
        .helper {
            font-size: 0.9em;
            color: var(--muted);
            margin-top: 6px;
        }
        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }
        .primary {
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
        }
        .primary:hover { background: var(--blue-dark); }
        .secondary {
            background: white;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 10px 14px;
        }
        .danger {
            color: var(--danger);
            border-color: #efb0aa;
        }
        .error-text {
            color: var(--danger);
            margin-top: 10px;
            white-space: pre-wrap;
        }

        /* Conversation list */
        #list-view {
            overflow-y: auto;
            background: var(--soft);
            padding: 16px;
        }
        .list-shell {
            width: min(720px, 100%);
            margin: 0 auto;
        }
        .list-toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .conversation-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .conversation-title {
            font-weight: 700;
            margin-bottom: 4px;
            overflow-wrap: anywhere;
        }
        .conversation-date {
            color: var(--muted);
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .conversation-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }
        .conversation-actions button {
            border: 1px solid #ccc;
            background: white;
            border-radius: 9px;
            padding: 7px 10px;
        }
        .empty-state {
            background: white;
            border: 1px dashed #bbb;
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            color: var(--muted);
        }

        /* Chat */
        #chat-view {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: var(--soft);
            -webkit-overflow-scrolling: touch;
        }
        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 85%;
            line-height: 1.4;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
        .user-message {
            background: var(--blue);
            color: white;
            margin-left: auto;
            text-align: right;
        }
        .dawn-message {
            background: white;
            border: 1px solid var(--border);
            margin-right: auto;
        }
        .dawn-label {
            font-weight: bold;
            color: var(--muted);
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .thinking {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            font-style: italic;
        }
        .error-message {
            border-color: #f0b7b1;
        }
        .error-controls {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .retry-button {
            align-self: flex-start;
            border: 1px solid #bbb;
            background: white;
            padding: 7px 11px;
            border-radius: 9px;
        }
        details {
            color: #444;
            font-size: 0.92em;
        }
        details summary {
            cursor: pointer;
            color: #555;
        }
        .error-details {
            margin: 8px 0 0;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: #f5f5f5;
            padding: 8px;
            border-radius: 8px;
            max-height: 180px;
            overflow-y: auto;
        }
        #input-container {
            padding: 12px 15px;
            background: white;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }
        #message-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            min-width: 0;
        }
        #message-input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
        }
        #send-button {
            padding: 12px 20px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            flex-shrink: 0;
        }
        #send-button:hover { background: var(--blue-dark); }

        @media (max-width: 768px) {
            body { padding: 5px; }
            .container {
                border-radius: 10px;
                height: calc(100vh - 10px);
                height: calc(100dvh - 10px);
            }
            .header {
                padding: 10px 12px;
                align-items: flex-start;
            }
            .header h1 { font-size: 1.3em; }
            .header button {
                padding: 6px 9px;
                font-size: 0.86em;
            }
            #chat-container { padding: 10px; }
            .message {
                max-width: 92%;
                padding: 10px 14px;
            }
            #input-container {
                padding: 10px;
                gap: 6px;
            }
            #message-input {
                padding: 10px 12px;
                font-size: 16px;
            }
            #send-button {
                padding: 10px 16px;
                font-size: 14px;
            }
            .auth-card { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Dawn's Door</h1>
            <div id="header-actions" class="header-actions hidden">
                <button id="conversations-button" type="button">Conversations</button>
                <button id="lock-button" type="button">Lock Door</button>
            </div>
        </div>

        <div id="auth-view" class="view">
            <div id="auth-content" class="auth-card"></div>
        </div>

        <div id="list-view" class="view hidden">
            <div class="list-shell">
                <div class="list-toolbar">
                    <button id="new-conversation-button" class="primary" type="button">Start New</button>
                    <button id="change-password-button" class="secondary" type="button">Change Password</button>
                    <button id="clear-all-button" class="secondary danger" type="button">Clear All History</button>
                </div>
                <div id="conversation-list"></div>
            </div>
        </div>

        <div id="chat-view" class="view hidden">
            <div id="chat-container"></div>
            <div id="input-container">
                <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off">
                <button id="send-button" type="button">Send</button>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = 'https://dawns-door-proxy.goddessdawnie.workers.dev';
        const MAX_OUTPUT_TOKENS = 5000;
        const REQUEST_TIMEOUT_MS = 60000;
        const MODEL_CONTEXT_MESSAGES = 50;

        const DB_NAME = 'dawns-door-v2';
        const DB_VERSION = 1;
        const SETTINGS_STORE = 'settings';
        const CONVERSATIONS_STORE = 'conversations';
        const PBKDF2_ITERATIONS = 200000;

        const authView = document.getElementById('auth-view');
        const authContent = document.getElementById('auth-content');
        const listView = document.getElementById('list-view');
        const chatView = document.getElementById('chat-view');
        const headerActions = document.getElementById('header-actions');
        const chatContainer = document.getElementById('chat-container');
        const conversationList = document.getElementById('conversation-list');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');

        let db = null;
        let cryptoKey = null;
        let activeConversation = null;
        let conversationHistory = [];
        let requestInFlight = false;

        // The Dawn system prompt lives privately in the Cloudflare Worker.

        // ---------- IndexedDB ----------
        function openDatabase() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = () => {
                    const database = request.result;
                    if (!database.objectStoreNames.contains(SETTINGS_STORE)) {
                        database.createObjectStore(SETTINGS_STORE, { keyPath: 'id' });
                    }
                    if (!database.objectStoreNames.contains(CONVERSATIONS_STORE)) {
                        const store = database.createObjectStore(CONVERSATIONS_STORE, { keyPath: 'id' });
                        store.createIndex('updatedAt', 'updatedAt');
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function idbRequest(request) {
            return new Promise((resolve, reject) => {
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function getSetting(id) {
            const tx = db.transaction(SETTINGS_STORE, 'readonly');
            return idbRequest(tx.objectStore(SETTINGS_STORE).get(id));
        }

        async function putSetting(value) {
            const tx = db.transaction(SETTINGS_STORE, 'readwrite');
            await idbRequest(tx.objectStore(SETTINGS_STORE).put(value));
        }

        async function getConversationRecord(id) {
            const tx = db.transaction(CONVERSATIONS_STORE, 'readonly');
            return idbRequest(tx.objectStore(CONVERSATIONS_STORE).get(id));
        }

        async function getAllConversationRecords() {
            const tx = db.transaction(CONVERSATIONS_STORE, 'readonly');
            return idbRequest(tx.objectStore(CONVERSATIONS_STORE).getAll());
        }

        async function putConversationRecord(record) {
            const tx = db.transaction(CONVERSATIONS_STORE, 'readwrite');
            await idbRequest(tx.objectStore(CONVERSATIONS_STORE).put(record));
        }

        async function deleteConversationRecord(id) {
            const tx = db.transaction(CONVERSATIONS_STORE, 'readwrite');
            await idbRequest(tx.objectStore(CONVERSATIONS_STORE).delete(id));
        }

        async function clearDatabaseData() {
            const tx = db.transaction([SETTINGS_STORE, CONVERSATIONS_STORE], 'readwrite');
            tx.objectStore(SETTINGS_STORE).clear();
            tx.objectStore(CONVERSATIONS_STORE).clear();
            await new Promise((resolve, reject) => {
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error);
            });
        }

        // ---------- Crypto ----------
        function randomBytes(length) {
            const bytes = new Uint8Array(length);
            crypto.getRandomValues(bytes);
            return bytes;
        }

        async function deriveKey(password, salt) {
            const material = await crypto.subtle.importKey(
                'raw',
                new TextEncoder().encode(password),
                'PBKDF2',
                false,
                ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt,
                    iterations: PBKDF2_ITERATIONS,
                    hash: 'SHA-256'
                },
                material,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptObject(key, object) {
            const iv = randomBytes(12);
            const plaintext = new TextEncoder().encode(JSON.stringify(object));
            const ciphertext = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv },
                key,
                plaintext
            );
            return {
                iv: Array.from(iv),
                ciphertext: Array.from(new Uint8Array(ciphertext))
            };
        }

        async function decryptObject(key, encrypted) {
            const plaintext = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: new Uint8Array(encrypted.iv) },
                key,
                new Uint8Array(encrypted.ciphertext)
            );
            return JSON.parse(new TextDecoder().decode(plaintext));
        }

        async function makeSecurityRecord(password) {
            const salt = randomBytes(16);
            const key = await deriveKey(password, salt);
            const verifier = await encryptObject(key, { check: 'dawns-door-unlocked' });
            return {
                record: {
                    id: 'security',
                    salt: Array.from(salt),
                    verifier
                },
                key
            };
        }

        async function keyFromPassword(password, securityRecord) {
            const key = await deriveKey(password, new Uint8Array(securityRecord.salt));
            const verifier = await decryptObject(key, securityRecord.verifier);
            if (!verifier || verifier.check !== 'dawns-door-unlocked') {
                throw new Error('Incorrect password.');
            }
            return key;
        }

        // ---------- View helpers ----------
        function showOnly(view) {
            authView.classList.toggle('hidden', view !== 'auth');
            listView.classList.toggle('hidden', view !== 'list');
            chatView.classList.toggle('hidden', view !== 'chat');
            headerActions.classList.toggle('hidden', view === 'auth');
        }

        function setAuthHtml(html) {
            authContent.innerHTML = html;
        }

        function formatDate(timestamp) {
            return new Intl.DateTimeFormat(undefined, {
                dateStyle: 'medium',
                timeStyle: 'short'
            }).format(new Date(timestamp));
        }

        function makeDefaultTitle(timestamp) {
            return formatDate(timestamp);
        }

        async function requestPersistentStorage() {
            try {
                if (navigator.storage && navigator.storage.persist) {
                    await navigator.storage.persist();
                }
            } catch (_) {
                // Persistence is a best-effort browser feature. Nothing breaks if denied.
            }
        }

        // ---------- Password/setup screens ----------
        function renderSetupScreen(message = '') {
            showOnly('auth');
            setAuthHtml(`
                <h2>Create your Dawn's Door password</h2>
                <div class="guidance">
                    Use a new password just for Dawn's Door. Don't reuse any password you already use.
                    Your password is not stored and cannot be recovered if you forget it, but you can
                    clear all history and create a new one if you need to.
                </div>
                <div class="field">
                    <label for="setup-password">Password</label>
                    <input id="setup-password" type="password" autocomplete="off">
                    <div class="helper">Longer passwords are harder for someone else to guess. For your privacy, don't save this password in your browser.</div>
                </div>
                <div class="field">
                    <label for="setup-password-confirm">Confirm password</label>
                    <input id="setup-password-confirm" type="password" autocomplete="off">
                </div>
                <div class="button-row">
                    <button id="setup-submit" class="primary" type="button">Create Password</button>
                </div>
                <div id="setup-error" class="error-text">${escapeHtml(message)}</div>
            `);

            const password = document.getElementById('setup-password');
            const confirmPassword = document.getElementById('setup-password-confirm');
            const submit = document.getElementById('setup-submit');
            const error = document.getElementById('setup-error');

            const create = async () => {
                error.textContent = '';
                if (!password.value) {
                    error.textContent = 'Please enter a password.';
                    return;
                }
                if (password.value !== confirmPassword.value) {
                    error.textContent = 'Those passwords do not match.';
                    return;
                }
                submit.disabled = true;
                try {
                    const { record, key } = await makeSecurityRecord(password.value);
                    await putSetting(record);
                    cryptoKey = key;
                    password.value = '';
                    confirmPassword.value = '';
                    await requestPersistentStorage();
                    await createNewConversation();
                } catch (err) {
                    error.textContent = `I couldn't set up local storage: ${err.message}`;
                    submit.disabled = false;
                }
            };

            submit.addEventListener('click', create);
            confirmPassword.addEventListener('keydown', e => {
                if (e.key === 'Enter') create();
            });
            password.focus();
        }

        function renderUnlockScreen(message = '') {
            showOnly('auth');
            setAuthHtml(`
                <h2>Dawn's Door is locked</h2>
                <p>Enter your Dawn's Door password to open your saved conversations.</p>
                <div class="field">
                    <label for="unlock-password">Password</label>
                    <input id="unlock-password" type="password" autocomplete="off">
                    <div class="helper">For your privacy, don't save this password in your browser.</div>
                </div>
                <div class="button-row">
                    <button id="unlock-submit" class="primary" type="button">Unlock</button>
                    <button id="locked-reset" class="secondary danger" type="button">Clear all history &amp; create a new password</button>
                </div>
                <div id="unlock-error" class="error-text">${escapeHtml(message)}</div>
            `);

            const password = document.getElementById('unlock-password');
            const submit = document.getElementById('unlock-submit');
            const error = document.getElementById('unlock-error');

            const unlock = async () => {
                error.textContent = '';
                submit.disabled = true;
                try {
                    const security = await getSetting('security');
                    cryptoKey = await keyFromPassword(password.value, security);
                    password.value = '';
                    await requestPersistentStorage();
                    await renderConversationList();
                } catch (_) {
                    cryptoKey = null;
                    error.textContent = 'That password did not unlock the Door.';
                    submit.disabled = false;
                    password.select();
                }
            };

            submit.addEventListener('click', unlock);
            password.addEventListener('keydown', e => {
                if (e.key === 'Enter') unlock();
            });
            document.getElementById('locked-reset').addEventListener('click', resetEverything);
            password.focus();
        }

        async function renderChangePasswordScreen() {
            if (!cryptoKey) return;
            showOnly('auth');
            headerActions.classList.remove('hidden');
            setAuthHtml(`
                <h2>Change Dawn's Door password</h2>
                <p>This re-encrypts every saved conversation with the new password.</p>
                <div class="field">
                    <label for="new-password">New password</label>
                    <input id="new-password" type="password" autocomplete="off">
                    <div class="helper">Longer passwords are harder for someone else to guess. For your privacy, don't save this password in your browser.</div>
                </div>
                <div class="field">
                    <label for="new-password-confirm">Confirm new password</label>
                    <input id="new-password-confirm" type="password" autocomplete="off">
                </div>
                <div class="button-row">
                    <button id="change-password-submit" class="primary" type="button">Change Password</button>
                    <button id="change-password-cancel" class="secondary" type="button">Cancel</button>
                </div>
                <div id="change-password-error" class="error-text"></div>
            `);

            const password = document.getElementById('new-password');
            const confirmPassword = document.getElementById('new-password-confirm');
            const submit = document.getElementById('change-password-submit');
            const error = document.getElementById('change-password-error');

            document.getElementById('change-password-cancel').addEventListener('click', renderConversationList);

            submit.addEventListener('click', async () => {
                error.textContent = '';
                if (!password.value) {
                    error.textContent = 'Please enter a password.';
                    return;
                }
                if (password.value !== confirmPassword.value) {
                    error.textContent = 'Those passwords do not match.';
                    return;
                }

                submit.disabled = true;
                try {
                    const records = await getAllConversationRecords();
                    const decrypted = [];
                    for (const record of records) {
                        decrypted.push({
                            record,
                            payload: await decryptObject(cryptoKey, record.encrypted)
                        });
                    }

                    const { record: securityRecord, key: newKey } = await makeSecurityRecord(password.value);

                    const rewritten = [];
                    for (const item of decrypted) {
                        rewritten.push({
                            ...item.record,
                            encrypted: await encryptObject(newKey, item.payload)
                        });
                    }

                    const tx = db.transaction([SETTINGS_STORE, CONVERSATIONS_STORE], 'readwrite');
                    tx.objectStore(SETTINGS_STORE).put(securityRecord);
                    const convStore = tx.objectStore(CONVERSATIONS_STORE);
                    for (const record of rewritten) convStore.put(record);

                    await new Promise((resolve, reject) => {
                        tx.oncomplete = resolve;
                        tx.onerror = () => reject(tx.error);
                        tx.onabort = () => reject(tx.error);
                    });

                    cryptoKey = newKey;
                    password.value = '';
                    confirmPassword.value = '';
                    await renderConversationList();
                } catch (err) {
                    error.textContent = `The password was not changed: ${err.message}`;
                    submit.disabled = false;
                }
            });

            password.focus();
        }

        // ---------- Conversations ----------
        function newConversationId() {
            if (crypto.randomUUID) return crypto.randomUUID();
            return `${Date.now()}-${Array.from(randomBytes(8)).map(b => b.toString(16).padStart(2, '0')).join('')}`;
        }

        async function createNewConversation() {
            if (!cryptoKey) return;
            const now = Date.now();
            activeConversation = {
                id: newConversationId(),
                createdAt: now,
                updatedAt: now,
                title: makeDefaultTitle(now),
                messages: []
            };
            conversationHistory = [];
            await saveActiveConversation();
            openActiveConversation();
        }

        async function saveActiveConversation() {
            if (!cryptoKey || !activeConversation) return;
            activeConversation.updatedAt = Date.now();
            activeConversation.messages = conversationHistory;
            const encrypted = await encryptObject(cryptoKey, {
                title: activeConversation.title,
                messages: activeConversation.messages
            });
            await putConversationRecord({
                id: activeConversation.id,
                createdAt: activeConversation.createdAt,
                updatedAt: activeConversation.updatedAt,
                encrypted
            });
        }

        async function loadConversation(id) {
            if (!cryptoKey) return;
            const record = await getConversationRecord(id);
            if (!record) return;
            const payload = await decryptObject(cryptoKey, record.encrypted);
            activeConversation = {
                id: record.id,
                createdAt: record.createdAt,
                updatedAt: record.updatedAt,
                title: payload.title || makeDefaultTitle(record.createdAt),
                messages: Array.isArray(payload.messages) ? payload.messages : []
            };
            conversationHistory = activeConversation.messages.slice();
            openActiveConversation();
        }

        function openActiveConversation() {
            showOnly('chat');
            renderChatHistory();
            messageInput.disabled = false;
            sendButton.disabled = false;
            messageInput.focus();
        }

        function renderChatHistory() {
            chatContainer.replaceChildren();
            if (!conversationHistory.length) {
                addMessage('Dawn', "Hey, beautiful lady. How's it going?");
                return;
            }
            for (const message of conversationHistory) {
                addMessage(message.role === 'user' ? 'You' : 'Dawn', message.content);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function renderConversationList() {
            if (!cryptoKey) return;
            showOnly('list');
            conversationList.replaceChildren();

            try {
                const records = await getAllConversationRecords();
                records.sort((a, b) => b.updatedAt - a.updatedAt);

                if (!records.length) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-state';
                    empty.textContent = 'No saved conversations yet.';
                    conversationList.appendChild(empty);
                    return;
                }

                for (const record of records) {
                    const payload = await decryptObject(cryptoKey, record.encrypted);
                    const card = document.createElement('div');
                    card.className = 'conversation-card';

                    const title = document.createElement('div');
                    title.className = 'conversation-title';
                    title.textContent = payload.title || makeDefaultTitle(record.createdAt);

                    const date = document.createElement('div');
                    date.className = 'conversation-date';
                    date.textContent = `Started ${formatDate(record.createdAt)}`;

                    const actions = document.createElement('div');
                    actions.className = 'conversation-actions';

                    const open = makeButton('Open', () => loadConversation(record.id));
                    const rename = makeButton('Rename', async () => {
                        const currentTitle = payload.title || makeDefaultTitle(record.createdAt);
                        const renamed = window.prompt('Conversation name:', currentTitle);
                        if (renamed === null) return;
                        const trimmed = renamed.trim();
                        payload.title = trimmed || makeDefaultTitle(record.createdAt);
                        record.updatedAt = Date.now();
                        record.encrypted = await encryptObject(cryptoKey, payload);
                        await putConversationRecord(record);
                        await renderConversationList();
                    });
                    const del = makeButton('Delete', async () => {
                        if (!window.confirm('Delete this conversation permanently? This cannot be undone.')) return;
                        await deleteConversationRecord(record.id);
                        if (activeConversation && activeConversation.id === record.id) {
                            activeConversation = null;
                            conversationHistory = [];
                        }
                        await renderConversationList();
                    });
                    del.classList.add('danger');

                    actions.append(open, rename, del);
                    card.append(title, date, actions);
                    conversationList.appendChild(card);
                }
            } catch (err) {
                conversationList.textContent = `I couldn't open the saved conversation list: ${err.message}`;
            }
        }

        function makeButton(text, handler) {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = text;
            button.addEventListener('click', handler);
            return button;
        }

        // ---------- Chat rendering ----------
        function addMessage(sender, content, isThinking = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';

            if (sender === 'You') {
                messageDiv.classList.add('user-message');
                messageDiv.textContent = content;
            } else {
                messageDiv.classList.add('dawn-message');
                if (isThinking) messageDiv.classList.add('thinking');

                if (!isThinking) {
                    const label = document.createElement('div');
                    label.className = 'dawn-label';
                    label.textContent = 'Dawn';
                    messageDiv.appendChild(label);
                }

                const contentDiv = document.createElement('div');
                contentDiv.textContent = content;
                messageDiv.appendChild(contentDiv);
            }

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        function addFailureMessage(details, retryHandler) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message dawn-message error-message';

            const label = document.createElement('div');
            label.className = 'dawn-label';
            label.textContent = 'Dawn';

            const text = document.createElement('div');
            text.textContent = "I'm sorry, sweetheart, I'm having trouble connecting right now. Message the real Dawn and let her know, please.";

            const controls = document.createElement('div');
            controls.className = 'error-controls';

            const retry = document.createElement('button');
            retry.type = 'button';
            retry.className = 'retry-button';
            retry.textContent = 'Retry';
            retry.addEventListener('click', async () => {
                retry.disabled = true;
                await retryHandler(messageDiv);
            });

            const detailBox = document.createElement('details');
            const summary = document.createElement('summary');
            summary.textContent = 'Show error details';
            const pre = document.createElement('div');
            pre.className = 'error-details';
            pre.textContent = details;
            detailBox.append(summary, pre);

            controls.append(retry, detailBox);
            messageDiv.append(label, text, controls);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        // ---------- DeepSeek request ----------
        async function requestAssistant(continuationInstruction = null) {
            const messages = conversationHistory.slice(-MODEL_CONTEXT_MESSAGES);

            // A continuation instruction is sent only for this request. It is not saved
            // into the conversation history, so it cannot become part of Lexi's thread.
            const requestMessages = continuationInstruction
                ? [...messages, { role: 'user', content: continuationInstruction }]
                : messages;

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: requestMessages,
                        temperature: 0.8,
                        max_tokens: MAX_OUTPUT_TOKENS
                    }),
                    signal: controller.signal
                });

                const raw = await response.text();

                if (!response.ok) {
                    const detail = raw
                        ? `HTTP ${response.status}\n${raw}`
                        : `HTTP ${response.status}${response.statusText ? ` ${response.statusText}` : ''}`;
                    throw new Error(detail);
                }

                let data;
                try {
                    data = JSON.parse(raw);
                } catch (_) {
                    throw new Error(`The server returned something that was not valid JSON.\n${raw.slice(0, 1000)}`);
                }

                const choice = data?.choices?.[0];
                const assistantMessage = choice?.message?.content;
                const finishReason = choice?.finish_reason ?? 'unknown';

                if (typeof assistantMessage !== 'string') {
                    throw new Error(`The server response did not contain a usable message.\nfinish_reason: ${finishReason}\n${raw.slice(0, 1000)}`);
                }

                return {
                    content: assistantMessage,
                    finishReason
                };
            } catch (err) {
                if (err.name === 'AbortError') {
                    throw new Error('The request timed out after 60 seconds.');
                }
                throw err;
            } finally {
                clearTimeout(timer);
            }
        }

        function addLengthNotice() {
            const notice = document.createElement('div');
            notice.className = 'message dawn-message';
            notice.style.fontSize = '0.9em';

            const text = document.createElement('div');
            text.textContent = "That response reached the length limit.";

            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'retry-button';
            button.textContent = 'Continue';
            button.style.marginTop = '8px';

            button.addEventListener('click', async () => {
                button.disabled = true;
                notice.remove();
                await getAssistantResponse(
                    null,
                    "Continue exactly where your previous response stopped. Do not restart or summarize it."
                );
            });

            notice.append(text, button);
            chatContainer.appendChild(notice);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function getAssistantResponse(existingErrorDiv = null, continuationInstruction = null) {
            if (requestInFlight || !activeConversation || !cryptoKey) return;
            requestInFlight = true;
            messageInput.disabled = true;
            sendButton.disabled = true;

            if (existingErrorDiv?.isConnected) existingErrorDiv.remove();
            const thinkingDiv = addMessage('Dawn', 'Thinking...', true);

            try {
                const result = await requestAssistant(continuationInstruction);
                if (thinkingDiv.isConnected) thinkingDiv.remove();

                conversationHistory.push({ role: 'assistant', content: result.content });
                await saveActiveConversation();
                addMessage('Dawn', result.content);

                if (result.finishReason === 'length') {
                    addLengthNotice();
                } else if (result.finishReason !== 'stop' && result.finishReason !== 'unknown') {
                    console.info("Dawn's Door finish_reason:", result.finishReason);
                }
            } catch (error) {
                if (thinkingDiv.isConnected) thinkingDiv.remove();
                addFailureMessage(error.message, async errorDiv => {
                    await getAssistantResponse(errorDiv, continuationInstruction);
                });
            } finally {
                requestInFlight = false;
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || requestInFlight || !activeConversation || !cryptoKey) return;

            conversationHistory.push({ role: 'user', content: message });
            addMessage('You', message);
            messageInput.value = '';

            // Save the user's words immediately, even if the API call fails.
            try {
                await saveActiveConversation();
            } catch (error) {
                addFailureMessage(
                    `The message could not be saved locally.\n${error.message}`,
                    async errorDiv => {
                        try {
                            await saveActiveConversation();
                            if (errorDiv.isConnected) errorDiv.remove();
                            await getAssistantResponse();
                        } catch (retryError) {
                            const details = errorDiv.querySelector('.error-details');
                            if (details) details.textContent = `The message still could not be saved locally.\n${retryError.message}`;
                        }
                    }
                );
                return;
            }

            await getAssistantResponse();
        }

        // ---------- Privacy actions ----------
        function lockDoor() {
            cryptoKey = null;
            activeConversation = null;
            conversationHistory = [];
            requestInFlight = false;
            messageInput.value = '';
            chatContainer.replaceChildren();
            conversationList.replaceChildren();
            renderUnlockScreen();
        }

        async function resetEverything() {
            const first = window.confirm(
                'Clear ALL Dawn\'s Door history from this browser? Every saved conversation will be permanently deleted.'
            );
            if (!first) return;

            const second = window.confirm(
                'This cannot be undone. Clear everything and create a new password?'
            );
            if (!second) return;

            try {
                await clearDatabaseData();
                cryptoKey = null;
                activeConversation = null;
                conversationHistory = [];
                chatContainer.replaceChildren();
                conversationList.replaceChildren();
                renderSetupScreen();
            } catch (err) {
                window.alert(`I couldn't clear the saved data: ${err.message}`);
            }
        }

        // ---------- Small helpers ----------
        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        // ---------- Events ----------
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !messageInput.disabled) sendMessage();
        });

        document.getElementById('lock-button').addEventListener('click', lockDoor);
        document.getElementById('conversations-button').addEventListener('click', renderConversationList);
        document.getElementById('new-conversation-button').addEventListener('click', createNewConversation);
        document.getElementById('change-password-button').addEventListener('click', renderChangePasswordScreen);
        document.getElementById('clear-all-button').addEventListener('click', resetEverything);

        // ---------- Initialize ----------
        window.addEventListener('load', async () => {
            try {
                db = await openDatabase();

                if (!window.crypto?.subtle) {
                    renderSetupScreen('This browser does not support the encryption tools Dawn\'s Door needs.');
                    return;
                }

                const security = await getSetting('security');
                if (security) {
                    renderUnlockScreen();
                } else {
                    renderSetupScreen();
                }
            } catch (err) {
                showOnly('auth');
                setAuthHtml(`
                    <h2>Dawn's Door couldn't open local storage</h2>
                    <p class="error-text">${escapeHtml(err.message)}</p>
                `);
            }
        });
    </script>
</body>
</html>
